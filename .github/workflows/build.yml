name: Build APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          RELEASE_STORE_PASSWORD: miniichat
          RELEASE_KEY_ALIAS: miniichat
          RELEASE_KEY_PASSWORD: miniichat

      - name: Upload debug APK (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-lab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-lab-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish native symbols for this commit (release "native-symbols")
        if: github.event_name == 'push'
        run: |
          mkdir -p symbols
          sha="${GITHUB_SHA::7}"
          for lib in whisper-gpu:libwhisper_jni_gpu whisper-opt:libwhisper_jni_v82; do
            mod="${lib%%:*}"; name="${lib##*:}"
            f=$(find "$mod/build/intermediates/cxx" -path "*Release*" -path "*arm64-v8a*" -name "$name.so" | head -1)
            [ -n "$f" ] && cp "$f" "symbols/$name-$sha.so" && echo "symbols: $f"
          done
          ls -la symbols

      - name: Upload symbols to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-symbols
          name: Native debug symbols
          body: Unstripped JNI libraries per commit (name-<sha>.so) for symbolizing crash backtraces from the engine log.
          files: symbols/*.so
          make_latest: false

      - name: Upload native debug symbols (for crash backtraces)
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: |
            whisper-gpu/build/intermediates/cxx/**/obj/arm64-v8a/*.so
            whisper-opt/build/intermediates/cxx/**/obj/arm64-v8a/*.so
          if-no-files-found: warn

      # GitHub Release: only attach release APKs (v7 + v8 split), no debug.
      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

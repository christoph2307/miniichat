name: Build German Whisper model (q5_0)

# Quantizes the German fine-tune of Whisper large-v3-turbo (q5_0 for CPU, q8_0 for GPU)
# (primeline/whisper-large-v3-turbo-german, ggml conversion by cstr) to q5_0 and publishes it as
# release assets in "whisper-models", which the app downloads.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/german-model.yml'

permissions:
  contents: write

jobs:
  quantize:
    runs-on: ubuntu-latest
    env:
      WHISPER_CPP_TAG: v1.9.5
      SOURCE_URL: https://huggingface.co/cstr/whisper-large-v3-turbo-german-ggml/resolve/main/ggml-model.bin
    steps:
      - name: Build whisper.cpp tools
        run: |
          git clone --depth 1 -b "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp
          cmake -S whisper.cpp -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build build --target whisper-quantize whisper-cli -j "$(nproc)"
          ls -la build/bin

      - name: Download German model (f16, ~1.6 GB)
        run: |
          curl -fL --retry 5 --retry-delay 10 -o ggml-large-v3-turbo-german.bin "$SOURCE_URL"
          ls -la ggml-large-v3-turbo-german.bin

      - name: Quantize (q5_0 for CPU, q8_0 for GPU)
        run: |
          for q in q5_0 q8_0; do
            ./build/bin/whisper-quantize ggml-large-v3-turbo-german.bin "ggml-large-v3-turbo-german-$q.bin" "$q"
          done
          ls -la ggml-large-v3-turbo-german-q*.bin
          sha256sum ggml-large-v3-turbo-german-q*.bin | tee SHA256SUMS

      - name: Smoke test (load each model + transcribe sample)
        run: |
          for q in q5_0 q8_0; do
            ./build/bin/whisper-cli -m "ggml-large-v3-turbo-german-$q.bin" -f whisper.cpp/samples/jfk.wav \
              -l en -t "$(nproc)" -otxt -of "smoke-$q"
            echo "--- $q transcript ---"; cat "smoke-$q.txt"
            test -s "smoke-$q.txt"
          done

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whisper-models
          name: Whisper models
          body: |
            Whisper models for MiniiChat Lab (downloaded from Settings → Speech recognition).

            * `ggml-large-v3-turbo-german-q5_0.bin` (CPU) and `ggml-large-v3-turbo-german-q8_0.bin` (GPU) — quantizations of
              [primeline/whisper-large-v3-turbo-german](https://huggingface.co/primeline/whisper-large-v3-turbo-german)
              (ggml conversion: [cstr/whisper-large-v3-turbo-german-ggml](https://huggingface.co/cstr/whisper-large-v3-turbo-german-ggml)),
              quantized with whisper.cpp ${{ env.WHISPER_CPP_TAG }}. License: Apache-2.0 (upstream model).
          files: |
            ggml-large-v3-turbo-german-q5_0.bin
            ggml-large-v3-turbo-german-q8_0.bin
            SHA256SUMS
          make_latest: false
